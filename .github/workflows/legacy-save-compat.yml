name: Legacy save compatibility

on:
  push:
    branches: ['test/selected-pages-legacy-compat']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-save-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test legacy original loading and save recovery
        run: |
          bash ./gradlew :app:testGithubDebugUnitTest \
            --tests ceui.pixiv.ui.download.PageDownloadSelectionTest \
            --tests ceui.pixiv.download.ImagePageSaveJournalTest \
            --tests ceui.pixiv.download.ImagePageSaverRecoveryTest \
            --tests ceui.lisa.core.DownloadImageSharingTest \
            --tests ceui.pixiv.imageloader.PageImageSourceResolverTest \
            --tests ceui.pixiv.download.StageStoreTest \
            --parallel --build-cache --console=plain -PSHAFT_TEST_ABI=arm64-v8a
      - name: Run full app unit tests
        run: bash ./gradlew :app:testGithubDebugUnitTest --parallel --build-cache --console=plain -PSHAFT_TEST_ABI=arm64-v8a
      - name: Run Android lint
        run: bash ./gradlew :app:lintGithubDebug --parallel --build-cache --console=plain -PSHAFT_TEST_ABI=arm64-v8a
      - name: Verify Room schemas
        run: |
          changes="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [ -n "$changes" ]; then printf '%s\n' "$changes"; exit 1; fi
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-save-compatibility-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-githubDebug.*
          if-no-files-found: warn
          retention-days: 14
